<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniMax H3 Mobil Kontrol</title>
  </head>
  <body>
    <!-- Shown until React mounts (replaced by the app): the app icon on the
         app's background, so a slow first load isn't a blank screen. -->
    <div id="root">
      <div style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0f1115">
        <img src="/logo.png" alt="" width="96" height="96" style="animation: boot-pulse 1.1s ease-in-out infinite" />
      </div>
      <style>
        @keyframes boot-pulse {
          0%, 100% { transform: scale(0.85); opacity: 0.6; }
          50% { transform: scale(1); opacity: 1; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
