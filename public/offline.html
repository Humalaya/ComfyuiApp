<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bilgisayara ulaşılamıyor</title>
<!--
  Shown by Capacitor (server.errorPath in capacitor.config.ts) when the PC —
  which serves this whole app — can't be reached. Bundled inside the APK, so
  it works with the PC down.

  It first asks the native side why (window.ServerAddress.diagnose(), see
  ServerAddress.java): phone off Wi-Fi with Tailscale off, the PC's address
  changed (the app is found at another address on the home network — one tap
  reconnects there), the PC on but its app server down, or the PC off /
  asleep. No address is shown. "Bilgisayarı uyandır" asks the always-on relay
  phone at home (android/waker, over Tailscale) to send the PC a Wake-on-LAN
  packet, and sends one itself through window.WakeOnLan (WakeOnLan.java —
  helps only at home). "Adresi elle değiştir" opens a box for the PC's IP.
  Meanwhile the page keeps probing the PC and opens the app once it answers.
-->
<style>
  :root { --bg:#0f1115; --surface:#1a1d24; --surface-2:#22262f; --border:#2e333d; --text:#f2f3f5; --text-dim:#9aa1ab; --accent:#7c5cff; --danger:#ff5c5c; --warn:#e0a030; --success:#3ddc84; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  main { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; gap: 14px; max-width: 420px; margin: 0 auto; padding: 24px 16px; }
  .icon { font-size: 2.6rem; text-align: center; }
  h1 { margin: 0; font-size: 1.2rem; text-align: center; }
  p { margin: 0; color: var(--text-dim); font-size: 0.9rem; line-height: 1.5; text-align: center; }
  code { background: var(--surface-2); padding: 2px 6px; border-radius: 6px; font-size: 0.82rem; color: var(--text); }
  button { width: 100%; padding: 16px; border-radius: 12px; border: none; font-size: 1.05rem; font-weight: 600; }
  .primary { background: var(--accent); color: white; }
  .primary:disabled { background: var(--surface-2); color: var(--text-dim); }
  .secondary { background: var(--surface-2); color: var(--text); font-weight: 500; font-size: 0.95rem; padding: 13px; }
  .secondary:disabled { color: var(--text-dim); }
  .linklike { background: none; color: var(--text-dim); font-size: 0.85rem; padding: 6px; font-weight: 400; text-decoration: underline; }
  .status { min-height: 1.5em; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.9rem; color: var(--text-dim); text-align: center; }
  .status.ok { color: var(--success); }
  .status.err { color: var(--danger); }
  .spinner { width: 16px; height: 16px; flex-shrink: 0; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .warn { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--warn); color: var(--warn); font-size: 0.9rem; line-height: 1.45; text-align: center; }
  .addr { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }
  .addr input { width: 100%; padding: 13px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 1rem; }
  .addr .hint { font-size: 0.78rem; color: var(--text-dim); line-height: 1.45; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="icon" id="icon">⋯</div>
  <h1 id="title">Bağlantı kontrol ediliyor…</h1>
  <p id="detail">Bilgisayara neden ulaşılamadığına bakılıyor.</p>

  <div id="mismatch" class="warn" hidden></div>
  <button id="reconnect" class="primary" type="button" hidden>Yeni adrese bağlan</button>

  <button id="wake" class="primary" type="button" hidden>Bilgisayarı uyandır</button>
  <div id="status" class="status"></div>
  <button id="retry" class="secondary" type="button">Tekrar dene</button>

  <button id="addr-toggle" class="linklike" type="button" hidden>Adresi elle değiştir</button>
  <section class="addr" id="addr" hidden>
    <input id="addr-ip" type="text" inputmode="decimal" placeholder="PC'nin IP adresi" autocomplete="off">
    <button id="addr-save" class="secondary" type="button">Kaydet ve bağlan</button>
    <div id="addr-status" class="status"></div>
    <div class="hint">PC'de terminalde <b>ip -4 addr show enp6s0</b> yaz; "inet" satırındaki adres. Evin dışındaysan PC'nin Tailscale adresini yaz.</div>
    <button id="addr-reset" class="linklike" type="button">Uygulamanın varsayılan adresine dön</button>
  </section>
</main>
<script>
  // This PC's wired network card (enp6s0), the home LAN's broadcast address,
  // the APK's built-in app address (capacitor.config.ts server.url) and the
  // relay phone's Tailscale address. If any of these change, update them and
  // rebuild.
  const PC_MAC = '30:56:0f:5e:8e:52';
  const LAN_BROADCAST = '192.168.1.255';
  const DEFAULT_APP_URL = 'http://192.168.1.62:5173/';
  const RELAY_WAKE_URL = 'http://100.71.142.53:8099/wake';
  const PROBE_MS = 3000;
  const WAKE_TIMEOUT_MS = 90000;

  const SA = window.ServerAddress || null;
  // The address the app uses: saved on this phone, else the built-in one.
  const APP_URL = ((SA && SA.current()) || DEFAULT_APP_URL).replace(/\/?$/, '/');

  const $ = (id) => document.getElementById(id);
  const statusEl = $('status');
  const wakeBtn = $('wake');
  let wakeStartedAt = null;

  function setStatus(text, kind, spinning) {
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
    statusEl.innerHTML = (spinning ? '<span class="spinner"></span>' : '') + '<span></span>';
    statusEl.lastChild.textContent = text;
  }

  function show(icon, title, detailHtml) {
    $('icon').textContent = icon;
    $('title').textContent = title;
    $('detail').innerHTML = detailHtml;
  }

  // --- why can't we reach it? -------------------------------------------
  function explain(d) {
    $('addr-toggle').hidden = !SA;
    if (d.target === 'ok') {
      show('✓', 'Bilgisayar açık', 'Uygulama açılıyor…');
      location.replace(APP_URL);
      return;
    }
    if (d.found) {
      show('⇄', "Bilgisayarın adresi değişmiş", 'Uygulama ev ağında başka bir adreste bulundu.');
      $('mismatch').hidden = false;
      $('mismatch').textContent = 'Kayıtlı adres artık bilgisayarla örtüşmüyor (modem yeni bir adres vermiş). Yeni adrese tek dokunuşla geçebilirsin.';
      $('reconnect').hidden = false;
      $('reconnect').onclick = () => connectTo(d.found, $('reconnect'));
      return;
    }
    if (!d.wifi && !d.vpn) {
      show('⌁', 'Ev ağında değilsin', "Telefon Wi-Fi'ye bağlı değil ve Tailscale kapalı. Evdeysen Wi-Fi'ye bağlan; dışarıdaysan Tailscale'i aç.");
      return;
    }
    if (d.wifi && !d.sameLan && !d.vpn) {
      show('⌁', 'Ev ağında değilsin', "Bağlı olduğun Wi-Fi ev ağı değil. Tailscale'i aç ya da ev Wi-Fi'sine bağlan.");
      return;
    }
    if (d.target === 'refused') {
      show('⚙', 'Bilgisayar açık ama uygulama çalışmıyor',
        'Bilgisayar cevap veriyor ama uygulama sunucusu kapalı. PC\'de terminalde: <code>systemctl --user restart mobile-control</code>');
      return;
    }
    if (d.target === 'other') {
      show('⇄', 'Adreste başka bir cihaz var', 'Kayıtlı adreste bu uygulama değil, başka bir cihaz cevap veriyor.');
      $('mismatch').hidden = false;
      $('mismatch').textContent = 'Kayıtlı adres bilgisayarla örtüşmüyor ve uygulama ağda bulunamadı. Bilgisayar açıksa adresini "Adresi elle değiştir"den gir.';
      return;
    }
    // Nothing answers at the address, and the app isn't elsewhere on the LAN.
    show('☾', 'Bilgisayar kapalı ya da uykuda',
      d.vpn && !d.sameLan
        ? "Tailscale açık ama bilgisayara ulaşılamıyor. Bilgisayar uykuda, kapalı ya da PC'de Tailscale kapalı olabilir."
        : 'Bilgisayar ev ağında cevap vermiyor. Uyandırmayı dene.');
    wakeBtn.hidden = false;
  }

  function diagnose() {
    if (!SA || !SA.diagnose) {
      show('☾', 'Bilgisayara ulaşılamıyor', "Bilgisayar uykuda ya da kapalı olabilir. Evde değilsen bu telefonda Tailscale açık olmalı.");
      wakeBtn.hidden = false;
      return;
    }
    // diagnose() blocks a few seconds (LAN scan) — after the first paint.
    setTimeout(() => {
      let d = {};
      try { d = JSON.parse(SA.diagnose()); } catch { d = {}; }
      explain(d);
    }, 60);
  }

  function connectTo(ip, btn) {
    btn.disabled = true;
    setStatus('Bağlanılıyor…', '', true);
    setTimeout(() => {
      const err = SA.set(ip);
      if (err) {
        btn.disabled = false;
        setStatus(err, 'err', false);
      } else {
        setStatus('Kaydedildi — uygulama yeniden açılıyor…', 'ok', true);
      }
    }, 50);
  }

  // --- keep probing; open the app as soon as it answers -------------------
  async function serverUp() {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 2500);
    try {
      // no-cors: only "did anything answer" matters, not the body.
      await fetch(APP_URL + '?probe=' + Date.now(), { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal });
      return true;
    } catch {
      return false;
    } finally {
      clearTimeout(t);
    }
  }

  async function probeLoop() {
    if (await serverUp()) {
      setStatus('Bilgisayar açık — uygulama açılıyor…', 'ok', true);
      location.replace(APP_URL);
      return;
    }
    if (wakeStartedAt !== null && Date.now() - wakeStartedAt > WAKE_TIMEOUT_MS) {
      wakeStartedAt = null;
      wakeBtn.disabled = false;
      setStatus('Uyanmadı. Tailscale açık mı? Tekrar dene.', 'err', false);
    }
    setTimeout(probeLoop, PROBE_MS);
  }

  // --- wake ---------------------------------------------------------------
  async function askRelay() {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 6000);
    try {
      const res = await fetch(RELAY_WAKE_URL + '?t=' + Date.now(), { cache: 'no-store', signal: ctrl.signal });
      return res.ok;
    } catch {
      return false;
    } finally {
      clearTimeout(t);
    }
  }

  wakeBtn.addEventListener('click', async () => {
    wakeBtn.disabled = true;
    setStatus('Uyandırma sinyali gönderiliyor…', '', true);
    // Both, always: the relay works from anywhere (via Tailscale), the
    // direct packet only when this phone is on the home Wi-Fi — and covers
    // the relay phone being off.
    const localError = window.WakeOnLan ? window.WakeOnLan.wake(PC_MAC, LAN_BROADCAST) : 'yok';
    const relayOk = await askRelay();
    if (!relayOk && localError) {
      wakeBtn.disabled = false;
      setStatus('Evdeki uyandırıcı telefona ulaşılamadı. Tailscale açık mı?', 'err', false);
      return;
    }
    wakeStartedAt = Date.now();
    setStatus(
      relayOk
        ? 'Evdeki telefon sinyali gönderdi, bekleniyor…'
        : "Evdeki telefona ulaşılamadı — sinyal sadece bu telefondan gitti (evdeysen yeter). Bekleniyor…",
      '',
      true,
    );
  });

  // --- retry: check again from scratch ------------------------------------
  $('retry').addEventListener('click', () => location.reload());

  // --- manual address (behind a button) -----------------------------------
  if (SA) {
    $('addr-toggle').addEventListener('click', () => {
      $('addr').hidden = !$('addr').hidden;
      if (!$('addr').hidden) $('addr-ip').focus();
    });
    $('addr-save').addEventListener('click', () => {
      const ip = $('addr-ip').value.trim();
      if (!ip) return;
      const btn = $('addr-save');
      const st = $('addr-status');
      btn.disabled = true;
      st.className = 'status';
      st.innerHTML = '<span class="spinner"></span><span>Kontrol ediliyor…</span>';
      setTimeout(() => {
        const err = SA.set(ip);
        if (err) {
          btn.disabled = false;
          st.className = 'status err';
          st.textContent = err;
        } else {
          st.className = 'status ok';
          st.textContent = 'Kaydedildi — uygulama yeniden açılıyor…';
        }
      }, 50);
    });
    $('addr-reset').addEventListener('click', () => SA.reset());
  }

  diagnose();
  probeLoop();
</script>
</body>
</html>
